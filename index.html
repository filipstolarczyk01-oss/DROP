<style>
  :root {
    --ink: #14100D; --bg: #FBFAF7; --paper: #FFFFFF;
    --muted: #6B6459; --faint: #A39C90; --line: #E6E1D8;
    --accent: #6E1F24; --gold: #A98C50;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Jost', system-ui, sans-serif;
    --mono: 'Space Grotesk', monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--sans); font-weight: 300; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; padding-bottom: 76px; }
  a { color: inherit; }

  /* Pasek przecen */
  .ticker { background: var(--ink); color: #EDE7DC; overflow: hidden; padding: 9px 0; font-family: var(--mono); font-size: 11px; }
  .marquee { display: inline-flex; white-space: nowrap; animation: scroll 42s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .marquee { animation: none; } }
  .tick-item { margin: 0 10px; letter-spacing: 1px; }
  .tick-pct { color: var(--gold); margin-right: 7px; }
  .tick-dot { margin-left: 18px; font-size: 6px; vertical-align: middle; color: var(--accent); }

  /* Nagłówek */
  header { background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  .head-top { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 14px; }
  .logo { font-family: var(--serif); font-size: 30px; font-weight: 400; letter-spacing: 7px; text-indent: 7px; }
  .logo i { font-style: normal; color: var(--accent); font-size: 22px; letter-spacing: 0; }
  .head-r { display: flex; align-items: center; gap: 14px; }
  #lang { border: none; border-bottom: 1px solid var(--line); background: transparent; font-family: var(--mono);
    font-size: 10px; letter-spacing: 1.5px; color: var(--muted); padding: 3px 2px; text-transform: uppercase; }
  .live { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; color: var(--faint); }
  .live b { color: var(--accent); font-weight: 400; }
  nav { display: flex; gap: 22px; overflow-x: auto; padding: 0 22px 12px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { background: none; border: none; padding: 4px 0; font-size: 12px; cursor: pointer; color: var(--muted);
    font-family: var(--sans); font-weight: 300; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; border-bottom: 1px solid transparent; }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); }

  /* Hero */
  .hero { padding: 64px 22px 44px; text-align: center; }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 3.5px; text-transform: uppercase; color: var(--gold); margin: 0 0 22px; }
  h1 { font-family: var(--serif); font-size: clamp(40px, 12vw, 76px); line-height: 1.02; margin: 0; font-weight: 300; letter-spacing: -0.5px; }
  h1 em { font-style: italic; color: var(--accent); }
  .hero p { font-size: 14px; color: var(--muted); max-width: 440px; margin: 22px auto 0; line-height: 1.75; letter-spacing: .2px; }
  .rule { width: 44px; height: 1px; background: var(--gold); margin: 30px auto 0; }

  /* Filtry */
  .stats { display: flex; justify-content: center; gap: 34px; flex-wrap: wrap; margin-top: 34px; }
  .stat { text-align: center; }
  .stat b { display: block; font-family: var(--mono); font-size: 21px; font-weight: 500; }
  .stat span { font-family: var(--mono); font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--faint); }
  .totop { position: fixed; right: 18px; bottom: 92px; width: 42px; height: 42px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 15px; cursor: pointer; z-index: 35; opacity: 0;
    pointer-events: none; transition: opacity .25s; border-radius: 999px; }
  .totop.show { opacity: 1; pointer-events: auto; }
  .clear-f { background: none; border: none; color: var(--accent); font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; text-decoration: underline; cursor: pointer; font-family: var(--sans); padding: 8px 6px; }
  .verified { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); margin-top: 14px; }
  .verified::before { content: "✓"; color: var(--gold); font-size: 11px; }
  .ship { font-size: 11px; color: var(--faint); line-height: 1.7; margin-top: 14px; text-align: center; }
  .share-b { background: none; border: 1px solid var(--line); color: var(--muted); padding: 12px 0; width: 100%;
    font-family: var(--sans); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
  .filters { display: flex; gap: 8px; align-items: center; padding: 4px 22px 20px; flex-wrap: wrap; justify-content: center; }
  .chip { background: transparent; border: 1px solid var(--line); padding: 8px 16px; font-size: 11px; cursor: pointer;
    font-family: var(--sans); font-weight: 300; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); border-radius: 0; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  select { padding: 8px 10px; font-size: 11px; border: 1px solid var(--line); background: transparent; font-family: var(--sans);
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); border-radius: 0; }
  .search-wrap { padding: 4px 22px 16px; max-width: 520px; margin: 0 auto; }
  #q { width: 100%; padding: 13px 16px; font-family: var(--sans); font-weight: 300; font-size: 13px;
    letter-spacing: 1px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 0; }
  #q::placeholder { color: var(--faint); letter-spacing: 1px; }
  #brandBar { padding-bottom: 12px; }
  .more { background: transparent; border: 1px solid var(--ink); color: var(--ink); padding: 15px 40px;
    font-family: var(--sans); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer; }
  .count { text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--faint); padding-bottom: 8px; }

  /* Siatka */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1px; background: var(--line);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
  .empty { grid-column: 1 / -1; padding: 70px 20px; text-align: center; color: var(--faint); font-size: 13px; background: var(--bg); letter-spacing: 1px; }
  .card { background: var(--paper); cursor: pointer; position: relative; transition: background .25s; }
  .card:hover { background: #FCFBF8; }
  .thumb { position: relative; aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: linear-gradient(168deg, #F4F0E8, #E8E2D6); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .badge { position: absolute; top: 0; left: 0; background: var(--accent); color: #fff; font-family: var(--mono);
    font-size: 10px; letter-spacing: 1px; padding: 5px 9px; z-index: 3; }
  .tag { position: absolute; top: 10px; right: 10px; font-family: var(--mono); font-size: 8px; letter-spacing: 2px;
    padding: 4px 7px; z-index: 3; background: rgba(255,255,255,.92); color: var(--ink); }
  .body { padding: 16px 14px 18px; }
  .brand { font-family: var(--mono); font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--faint); }
  .name { font-family: var(--serif); font-size: 17px; margin: 7px 0 3px; line-height: 1.2; font-weight: 400; }
  .color { font-size: 11px; color: var(--faint); letter-spacing: .5px; margin-bottom: 11px; }
  .prices { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .pnew { font-family: var(--mono); font-size: 14px; }
  .pold { font-family: var(--mono); font-size: 11px; color: var(--faint); text-decoration: line-through; }
  .store { font-size: 10px; color: var(--faint); margin-top: 9px; letter-spacing: 1.5px; text-transform: uppercase; }
  .add { position: absolute; bottom: 14px; right: 12px; width: 32px; height: 32px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer; z-index: 4; font-family: var(--sans); }
  .add.in { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Pasek torby */
  .bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); color: #EDE7DC; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; transform: translateY(105%); transition: transform .3s ease; }
  .bar.show { transform: translateY(0); }
  .bar-l { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; line-height: 1.5; }
  .bar-l b { color: var(--gold); font-weight: 400; }
  .bar button { background: #EDE7DC; color: var(--ink); border: none; padding: 12px 20px; font-family: var(--sans);
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }

  /* Nakładka / panel */
  .overlay { position: fixed; inset: 0; background: rgba(20,16,13,.6); z-index: 60; display: none; }
  .overlay.open { display: block; }
  .sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg); max-height: 92vh; overflow-y: auto; padding: 26px 22px 40px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sheet-head h2 { font-family: var(--serif); font-size: 26px; font-weight: 400; margin: 0; }
  .close { background: none; border: none; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; font-family: var(--sans); }

  /* Karta produktu */
  .p-img { aspect-ratio: 4/5; max-height: 300px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(168deg, #F4F0E8, #E8E2D6); position: relative; overflow: hidden; margin-bottom: 20px; }
  .p-img img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .save { font-size: 12px; color: var(--accent); margin: 10px 0 22px; letter-spacing: .5px; }
  .cta { display: block; width: 100%; background: var(--accent); color: #fff; border: none; padding: 17px 0; font-size: 11px;
    letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer; font-family: var(--sans); text-align: center; text-decoration: none; }
  .cta.dark { background: var(--ink); }
  .cta.outline { background: transparent; color: var(--ink); border: 1px solid var(--ink); margin-top: 10px; }

  /* Lista w torbie */
  .row { display: flex; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .row-th { width: 54px; height: 68px; flex-shrink: 0; background: linear-gradient(168deg, #F4F0E8, #E8E2D6);
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .row-th img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .row-x { background: none; border: none; font-size: 10px; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px 0 0; font-family: var(--sans); }
  .totals { display: flex; justify-content: space-between; padding: 20px 0 4px; font-size: 15px; }
  .totals b { font-family: var(--mono); font-weight: 500; }
  .saved { font-size: 12px; color: var(--accent); margin-bottom: 20px; }
  .store-group { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--faint); padding-top: 18px; }

  .brands { padding: 70px 22px 10px; }
  .brand-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; max-width: 1100px; margin: 34px auto 0; }
  .brand-c { position: relative; color: #EDE7DC; text-decoration: none; padding: 26px 20px; min-height: 132px;
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; transition: transform .2s; }
  .brand-c:hover { transform: translateY(-2px); }
  .brand-c h3 { font-family: var(--serif); font-size: 23px; font-weight: 400; margin: 0; position: relative; }
  .brand-c .b-off { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--gold); position: relative; }
  .brand-c .b-store { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: .65; position: relative; }
  .recent-wrap { padding: 54px 22px 0; }
  .recent-row { display: flex; gap: 12px; overflow-x: auto; padding: 22px 0 6px; scrollbar-width: none; max-width: 1100px; margin: 0 auto; }
  .recent-row::-webkit-scrollbar { display: none; }
  .r-card { flex: 0 0 132px; cursor: pointer; background: var(--paper); border: 1px solid var(--card-line); }
  .r-card .thumb { aspect-ratio: 3/4; }
  .r-b { padding: 9px 10px 11px; }
  .r-b .brand { font-size: 8px; }
  .r-b .nm { font-family: var(--serif); font-size: 12px; line-height: 1.25; margin: 3px 0 4px; height: 30px; overflow: hidden; }
  .r-b .pnew { font-size: 12px; }
  .bag-clear { background: none; border: none; color: var(--faint); font-size: 11px; text-decoration: underline;
    cursor: pointer; font-family: var(--sans); display: block; margin: 14px auto 0; }
  .sec-h { font-family: var(--serif); font-size: clamp(26px, 7vw, 38px); font-weight: 300; text-align: center; margin: 0 0 10px; }
  .sec-p { font-size: 14px; color: var(--muted); line-height: 1.8; text-align: center; max-width: 460px; margin: 0 auto; }
  .sec-p.wide { max-width: 620px; text-align: left; }
  .why { padding: 66px 22px 10px; }
  .why-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 34px; max-width: 1000px; margin: 40px auto 0; }
  .why-i { text-align: center; }
  .why-n { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--gold); }
  .why-i h3 { font-family: var(--serif); font-size: 21px; font-weight: 400; margin: 12px 0 8px; }
  .why-i p { font-size: 13px; color: var(--muted); line-height: 1.75; margin: 0; }
  .alert { padding: 70px 22px; margin-top: 60px; background: var(--ink); color: #EDE7DC; }
  .alert .sec-h { color: #EDE7DC; }
  .alert .sec-p { color: #B9B1A2; }
  .alert-f { display: flex; gap: 0; max-width: 440px; margin: 28px auto 0; flex-wrap: wrap; }
  .alert-f input { flex: 1; min-width: 190px; padding: 15px 16px; border: 1px solid #3A342C; background: transparent;
    color: #EDE7DC; font-family: var(--sans); font-weight: 300; font-size: 13px; letter-spacing: .5px; border-radius: 0; }
  .alert-f button { padding: 15px 24px; background: #EDE7DC; color: var(--ink); border: none; cursor: pointer;
    font-family: var(--sans); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
  .alert .ok { margin-top: 18px; color: var(--gold); }
  .about { padding: 70px 22px 20px; }
  .faq { max-width: 620px; margin: 30px auto 0; }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { padding: 18px 0; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; color: var(--gold); font-size: 17px; }
  .faq details[open] summary::after { content: "−"; }
  .faq p { font-size: 13px; color: var(--muted); line-height: 1.8; margin: 0 0 20px; }
  footer { padding: 50px 26px 46px; font-size: 11px; color: var(--faint); text-align: center; line-height: 1.9;
    max-width: 620px; margin: 0 auto; letter-spacing: .3px; }
  footer .fl { font-family: var(--serif); font-size: 22px; letter-spacing: 6px; color: var(--ink); display: block; margin-bottom: 16px; }
  .toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #EDE7DC;
    padding: 11px 20px; font-size: 11px; letter-spacing: 1px; z-index: 100; max-width: 88vw; text-align: center; }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
</style>

<header>

<button class="totop" id="toTop" aria-label="Do góry">↑</button>

<div class="bar" id="bar">
  <div class="bar-l" id="barText"></div>
  <button id="barBtn"></button>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<script src="i18n.js"></script>
<script src="products.js"></script>
<script>
(function () {
  // ——— KURSY WALUT — wszystko liczone względem złotówki ———
  const KURS = { USD: 3.75, EUR: 4.25, GBP: 5.05, PLN: 1 };   // ile zł kosztuje 1 jednostka
  const ZNAK = { PLN: { s: " zł", p: false }, EUR: { s: " €", p: false },
                 GBP: { s: "£", p: true }, USD: { s: "$", p: true } };

  // Język: zapamiętany > z przeglądarki > polski
  let lang = "pl";
  try { const z = localStorage.getItem("drop_lang"); if (z && I18N[z]) lang = z; else {
    const b = (navigator.language || "pl").slice(0, 2); if (I18N[b]) lang = b; } } catch (e) {}
  let T = I18N[lang];

  // Cena: z waluty produktu -> na złotówki -> na walutę języka
  const zl = (n, c) => n * (KURS[c] || 1);                    // wartość w zł (do sortowania i sum)
  const wCur = n => n / (KURS[T.cur] || 1);                   // zł -> waluta języka
  function fmt(vZl) {
    const v = Math.round(wCur(vZl)), z = ZNAK[T.cur] || ZNAK.PLN;
    const t = v.toLocaleString(T.locale);
    return z.p ? z.s + t : t + z.s;
  }
  const price = (n, c) => fmt(zl(n, c));
  const cat = c => (T.cats && T.cats[c]) || c;
  const plural = n => n === 1 ? T.item1 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? T.item2 : T.item5;
  const fill = (str, o) => str.replace(/\{(\w+)\}/g, (_, k) => o[k]);
  const pct = p => Math.round((1 - p.price / p.oldPrice) * 100);
  const esc = s => String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

  // ——— Ilustracja, gdy produkt nie ma jeszcze zdjęcia ———
  const HUE = { "Kurtki": "#2E3A4E", "Kurtki puchowe": "#1F2C45", "Parki": "#7A6A4E", "Kamizelki": "#2A3040",
    "Overshirty": "#3E5C82", "Bluzy": "#37628F", "Koszule": "#4A6A8A", "Spodnie": "#454F63",
    "Polo": "#8C8574", "T-shirty": "#9A8F7A", "Kąpielówki": "#5B7C8C", "Buty": "#8A8172", "Swetry": "#9C9484" };
  const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16);
    const c = v => Math.max(0, Math.min(255, Math.round(v * f)));
    return "rgb(" + c(n >> 16) + "," + c((n >> 8) & 255) + "," + c(n & 255) + ")"; };

  function illo(p) {
    const hue = HUE[p.cat] || "#3A4256", line = shade(hue, .55), lite = shade(hue, 1.28);
    const c = (p.cat || "").toLowerCase();
    if (/but|sneaker/.test(c)) return `<svg viewBox="0 0 240 200" width="76%" style="position:relative;z-index:1">
      <path d="M28 148 Q30 118 52 112 Q74 106 92 118 Q112 132 142 136 Q186 142 198 152 Q206 160 200 168 L36 168 Q26 164 28 148 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>
      <path d="M28 160 L202 160 Q208 168 200 172 L34 172 Q26 168 28 160 Z" fill="${lite}" stroke="${line}" stroke-width="2.5"/>
      <path d="M56 116 Q70 126 78 140 M72 112 Q86 122 94 136 M88 116 Q100 126 108 138" stroke="${line}" stroke-width="2" fill="none"/>
      <circle cx="168" cy="146" r="7" fill="${lite}" stroke="${line}" stroke-width="2"/></svg>`;
    if (/kąpiel|short/.test(c)) return `<svg viewBox="0 0 240 240" width="66%" style="position:relative;z-index:1">
      <path d="M72 40 L168 40 L176 96 Q178 140 172 176 L130 176 Q126 140 120 116 Q114 140 110 176 L68 176 Q62 140 64 96 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>
      <path d="M72 40 L168 40 L170 58 L70 58 Z" fill="${lite}" stroke="${line}" stroke-width="2.5"/>
      <path d="M108 44 Q120 54 132 44" stroke="${line}" stroke-width="2" fill="none"/></svg>`;
    if (/spodnie|jean/.test(c)) return `<svg viewBox="0 0 240 300" width="56%" style="position:relative;z-index:1">
      <path d="M78 34 L162 34 L168 92 Q172 190 166 262 L128 262 Q124 180 120 132 Q116 180 112 262 L74 262 Q68 190 72 92 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>
      <path d="M78 34 L162 34 L164 54 L76 54 Z" fill="${lite}" stroke="${line}" stroke-width="2.5"/>
      <path d="M84 62 l24 6 l-3 30 l-24 -6 Z M156 62 l-24 6 l3 30 l24 -6 Z" fill="${lite}" stroke="${line}" stroke-width="2"/></svg>`;
    const polo = /polo|t-shirt|koszul/.test(c), krotki = polo;
    const kaptur = /puch|park|bluz/.test(c), dlugi = /park|overshirt/.test(c), kam = /kamizel/.test(c);
    const pik = /puch|kamizel/.test(c), dol = dlugi ? 268 : (krotki ? 226 : 248);
    return `<svg viewBox="0 0 240 300" width="72%" style="position:relative;z-index:1">
      <path d="M120 10 L120 26" stroke="#B0A895" stroke-width="2.5"/><circle cx="120" cy="8" r="5" stroke="#B0A895" stroke-width="2.5" fill="none"/>
      ${kaptur ? `<path d="M85 52 Q88 24 120 22 Q152 24 155 52 Q140 44 120 44 Q100 44 85 52 Z" fill="${lite}" stroke="${line}" stroke-width="2.5"/>`
        : polo ? `<path d="M104 44 L120 68 L136 44 L148 50 L138 62 L120 78 L102 62 L92 50 Z" fill="${lite}" stroke="${line}" stroke-width="2.5"/>`
        : `<path d="M92 46 Q120 34 148 46 L142 58 Q120 48 98 58 Z" fill="${lite}" stroke="${line}" stroke-width="2.5"/>`}
      ${kam ? "" : krotki
        ? `<path d="M80 60 Q54 70 46 112 L74 122 Q76 96 86 84 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>
           <path d="M160 60 Q186 70 194 112 L166 122 Q164 96 154 84 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>`
        : `<path d="M78 62 Q52 78 44 150 Q42 168 48 184 L74 176 Q70 130 84 92 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>
           <path d="M162 62 Q188 78 196 150 Q198 168 192 184 L166 176 Q170 130 156 92 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>`}
      <path d="M84 58 Q120 46 156 58 L162 96 Q166 160 160 ${dol} Q120 ${dol + 12} 80 ${dol} Q74 160 78 96 Z" fill="${hue}" stroke="${line}" stroke-width="2.5"/>
      ${polo ? `<path d="M120 68 L120 108" stroke="${line}" stroke-width="2"/><circle cx="120" cy="80" r="2.5" fill="${line}"/><circle cx="120" cy="96" r="2.5" fill="${line}"/>`
        : `<path d="M120 58 L120 ${dol + 4}" stroke="${line}" stroke-width="2" stroke-dasharray="1 4"/>`}
      ${pik ? [96,124,152,180,208].map(y => `<path d="M80 ${y} Q120 ${y+10} 160 ${y}" stroke="${line}" stroke-width="1.6" opacity=".7" fill="none"/>`).join("") : ""}
      ${polo ? "" : `<path d="M88 ${dol-52} l22 4 l-2 26 l-22 -4 Z M152 ${dol-52} l-22 4 l2 26 l22 -4 Z" fill="${lite}" stroke="${line}" stroke-width="2"/>`}
      ${kam || krotki ? "" : `<rect x="52" y="118" width="17" height="21" rx="3" fill="${lite}" stroke="${line}" stroke-width="2" transform="rotate(-8 60 128)"/>`}
    </svg>`;
  }

  const imgHTML = (p, cls) => `<div class="${cls}">
    ${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.brand)} ${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ""}
    ${illo(p)}</div>`;

  // ——— Kafle marek: linki do realnych wyprzedaży u partnerów ———
  const BRAND_SALES = [
    { n: "Moncler",       off: 70, store: "SSENSE",  hue: "#101822", url: "https://www.ssense.com/en-us/men/sale/designers/moncler" },
    { n: "C.P. Company",  off: 60, store: "SSENSE",  hue: "#2E2A3A", url: "https://www.ssense.com/en-us/men/sale/designers/cp-company" },
    { n: "C.P. Company",  off: 50, store: "END.",    hue: "#3A3226", url: "https://www.endclothing.com/us/sale/cp-company" },
    { n: "Stone Island",  off: 40, store: "END.",    hue: "#22304E", url: "https://www.endclothing.com/us/sale/stone-island" },
    { n: "Stone Island",  off: 40, store: "Giglio",  hue: "#2D4A3E", url: "https://www.giglio.com/en-us/stone-island/men.html" },
    { n: "Menswear",      off: 60, store: "END.",    hue: "#4A3A32", url: "https://www.endclothing.com/us/sale/all-sale" },
  ];

  // ——— Stan ———
  let catF = "Wszystko", season = "", minPct = 0, sort = "drop", brandF = "", q = "";
  let shown = 24;                 // ile produktów widać (doczytywane porcjami)
  const PORCJA = 24;
  let storeF = "";
  let sel = [], recent = [];      // torba i ostatnio oglądane (zapisywane w przeglądarce)
  try {
    const z = JSON.parse(localStorage.getItem("drop_bag") || "[]");
    if (Array.isArray(z)) sel = z.filter(i => PRODUCTS[i]);
    const r = JSON.parse(localStorage.getItem("drop_recent") || "[]");
    if (Array.isArray(r)) recent = r.filter(i => PRODUCTS[i]);
  } catch (e) {}
  const zapisz = () => { try {
    localStorage.setItem("drop_bag", JSON.stringify(sel));
    localStorage.setItem("drop_recent", JSON.stringify(recent));
  } catch (e) {} };
  const cats = [...new Set(PRODUCTS.map(p => p.cat))].sort();
  const brands = [...new Set(PRODUCTS.map(p => p.brand))].sort();

  // Pasek marek pokazujemy tylko, gdy jest z czego wybierać
  if (brands.length > 1) {
    const bb = document.getElementById("brandBar");
    brands.slice(0, 12).forEach(b => {
      const el = document.createElement("button");
      el.className = "chip"; el.dataset.b = b; el.textContent = b;
      el.onclick = () => { brandF = brandF === b ? "" : b; shown = PORCJA; render(); };
      bb.appendChild(el);
    });
  }

  const stores = [...new Set(PRODUCTS.map(p => p.store))].sort();
  if (stores.length > 1) {
    const sb = document.getElementById("storeBar");
    stores.forEach(st => {
      const el = document.createElement("button");
      el.className = "chip"; el.dataset.st = st; el.textContent = st;
      el.onclick = () => { storeF = storeF === st ? "" : st; shown = PORCJA; render(); };
      sb.appendChild(el);
    });
  }

  let qT;
  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(qT);
    qT = setTimeout(() => { q = e.target.value.trim().toLowerCase(); shown = PORCJA; render(); }, 200);
  });

  const nav = document.getElementById("catNav");
  ["Wszystko", ...cats].forEach(c => {
    const b = document.createElement("button");
    b.dataset.c = c; b.onclick = () => { catF = c; shown = PORCJA; render(); };
    nav.appendChild(b);
  });

  document.querySelectorAll(".filters .chip").forEach(b => {
    b.onclick = () => {
      if (b.dataset.s) season = season === b.dataset.s ? "" : b.dataset.s;
      if (b.dataset.p) minPct = minPct === +b.dataset.p ? 0 : +b.dataset.p;
      shown = PORCJA; render();
    };
  });
  document.getElementById("sortSel").onchange = e => { sort = e.target.value; shown = PORCJA; render(); };

  const hot = PRODUCTS.filter(p => p.hot);
  document.getElementById("ticker").innerHTML = [...hot, ...hot, ...hot].map(p =>
    `<span class="tick-item"><span class="tick-pct">−${pct(p)}%</span>${esc(p.brand)} ${esc(p.name)}<span class="tick-dot">●</span></span>`).join("");

  const overlay = document.getElementById("overlay"), sheet = document.getElementById("sheet");
  overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove("open"); };
  window.closeSheet = () => {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
  };
  const openSheet = () => {
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    sheet.scrollTop = 0;
    try { sheet.focus(); } catch (e) {}
  };

  let toastT;
  function toast(msg) {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
    document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2000);
  }

  // ——— Torba (lista zakupowa) ———
  window.toggleSel = (i, ev) => {
    if (ev) ev.stopPropagation();
    const at = sel.indexOf(i);
    if (at >= 0) { sel.splice(at, 1); toast(T.removed); }
    else { sel.push(i); toast(PRODUCTS[i].brand + " — " + T.added); }
    zapisz(); render(); updateBar();
  };

  window.clearBag = () => { sel = []; zapisz(); render(); updateBar(); closeSheet(); };

  function updateBar() {
    const bar = document.getElementById("bar");
    if (!sel.length) { bar.classList.remove("show"); return; }
    const tot = sel.reduce((s, i) => s + zl(PRODUCTS[i].price, PRODUCTS[i].currency), 0);
    const sav = sel.reduce((s, i) => s + zl(PRODUCTS[i].oldPrice - PRODUCTS[i].price, PRODUCTS[i].currency), 0);
    document.getElementById("barText").innerHTML =
      sel.length + " " + plural(sel.length) + " · " + fmt(tot) +
      "<br><b>" + T.saveBar + " " + fmt(sav) + "</b>";
    bar.classList.add("show");
  }
  document.getElementById("barBtn").onclick = openSel;

  function openSel() {
    const groups = {};
    sel.forEach(i => { const p = PRODUCTS[i]; (groups[p.store] = groups[p.store] || []).push(i); });
    const tot = sel.reduce((s, i) => s + zl(PRODUCTS[i].price, PRODUCTS[i].currency), 0);
    const sav = sel.reduce((s, i) => s + zl(PRODUCTS[i].oldPrice - PRODUCTS[i].price, PRODUCTS[i].currency), 0);

    sheet.innerHTML = `
      <div class="sheet-head"><h2>${T.bagTitle}</h2><button class="close" onclick="closeSheet()">${T.close}</button></div>
      ${Object.keys(groups).map(store => `
        <div class="store-group">${esc(store)}</div>
        ${groups[store].map(i => { const p = PRODUCTS[i]; return `
          <div class="row">
            ${imgHTML(p, "row-th")}
            <div style="flex:1">
              <div class="brand">${esc(p.brand)}</div>
              <div style="font-family:var(--serif);font-size:15px;line-height:1.25;margin:3px 0">${esc(p.name)}</div>
              <div class="color">${esc(p.color || "")}</div>
            </div>
            <div style="text-align:right">
              <div class="pnew">${price(p.price, p.currency)}</div>
              <button class="row-x" onclick="toggleSel(${i}, event)">${T.rm}</button>
            </div>
          </div>`; }).join("")}
      `).join("")}
      <div class="totals"><span>${T.total}</span><b>${fmt(tot)}</b></div>
      <div class="saved">${fill(T.saved, { x: fmt(sav) })}</div>
      ${Object.keys(groups).map(store => `
        <a class="cta ${store === Object.keys(groups)[0] ? "" : "outline"}" style="margin-top:10px"
           href="${esc(PRODUCTS[groups[store][0]].url)}" target="_blank" rel="noopener sponsored">
           ${fill(T.checkout, { store: esc(store), n: groups[store].length })}</a>`).join("")}
      <p style="font-size:11px;color:var(--faint);line-height:1.7;margin-top:18px;text-align:center">
        ${T.bagNote}</p>
      <button class="share-b" onclick="shareBag()">${T.share}</button>
      <button class="bag-clear" onclick="clearBag()">${T.clearBag}</button>`;
    openSheet();
  }

  // ——— Karta produktu ———
  window.openProduct = i => {
    const p = PRODUCTS[i], inSel = sel.includes(i);
    recent = [i, ...recent.filter(x => x !== i)].slice(0, 10);
    zapisz(); renderRecent();
    sheet.innerHTML = `
      <div class="sheet-head"><h2 style="font-size:20px">${esc(p.brand)}</h2><button class="close" onclick="closeSheet()">${T.close}</button></div>
      ${imgHTML(p, "p-img")}
      <div style="font-family:var(--serif);font-size:27px;line-height:1.15">${esc(p.name)}</div>
      <div class="color" style="margin-top:6px">${esc(p.color || "")}</div>
      <div class="prices" style="margin-top:12px">
        <span class="pnew" style="font-size:22px">${price(p.price, p.currency)}</span>
        <span class="pold">${price(p.oldPrice, p.currency)}</span>
        <span style="font-family:var(--mono);font-size:12px;color:var(--accent)">−${pct(p)}%</span>
      </div>
      <p class="save">${fill(T.save, { x: price(p.oldPrice - p.price, p.currency) })} · ${esc(p.store)}</p>
      <div class="verified">${esc(T.verified)}</div>
      <button class="cta dark" onclick="toggleSel(${i}); closeSheet();">${inSel ? T.remove : T.add}</button>
      <a class="cta outline" href="${esc(p.url)}" target="_blank" rel="noopener sponsored">${fill(T.buy, { store: esc(p.store) })}</a>
      <p class="ship">${T.prodNote}<br>${T.shipInfo}</p>`;
    openSheet();
  };

  function render() {
    document.querySelectorAll("#catNav button").forEach(b => {
      b.textContent = b.dataset.c === "Wszystko" ? T.all : cat(b.dataset.c);
      b.classList.toggle("on", b.dataset.c === catF);
    });
    document.querySelectorAll(".filters .chip").forEach(b => {
      b.classList.toggle("on", (b.dataset.s && b.dataset.s === season) || (b.dataset.p && +b.dataset.p === minPct));
    });

    document.querySelectorAll("#brandBar .chip").forEach(b => b.classList.toggle("on", b.dataset.b === brandF));
    document.querySelectorAll("#storeBar .chip").forEach(b => b.classList.toggle("on", b.dataset.st === storeF));

    let list = PRODUCTS.map((p, i) => ({ ...p, _i: i })).filter(p =>
      (catF === "Wszystko" || p.cat === catF) &&
      (brandF === "" || p.brand === brandF) &&
      (storeF === "" || p.store === storeF) &&
      (season === "" || (season === "lato" ? p.season === "lato" : p.season !== "lato")) &&
      pct(p) >= minPct &&
      (q === "" || (p.brand + " " + p.name + " " + (p.color || "") + " " + p.cat).toLowerCase().includes(q)));
    if (sort === "drop") list.sort((a, b) => pct(b) - pct(a));
    if (sort === "asc") list.sort((a, b) => zl(a.price, a.currency) - zl(b.price, b.currency));
    if (sort === "desc") list.sort((a, b) => zl(b.price, b.currency) - zl(a.price, a.currency));

    const aktywne = catF !== "Wszystko" || brandF || storeF || season || minPct || q;
    document.getElementById("clearWrap").innerHTML = aktywne
      ? `<button class="clear-f" id="clearBtn">${esc(T.clearAll)}</button>` : "";
    if (aktywne) document.getElementById("clearBtn").onclick = () => {
      catF = "Wszystko"; brandF = ""; storeF = ""; season = ""; minPct = 0; q = "";
      document.getElementById("q").value = ""; shown = PORCJA; render();
    };

    const total = list.length;
    const widoczne = list.slice(0, shown);
    document.getElementById("count").textContent =
      total === 0 ? "" : (total <= shown ? total + " " + T.products : widoczne.length + " " + T.of + " " + total + " " + T.products);

    const mw = document.getElementById("moreWrap");
    mw.innerHTML = total > shown
      ? `<button class="more" id="moreBtn">${T.more} +${Math.min(PORCJA, total - shown)}</button>`
      : "";
    if (total > shown) document.getElementById("moreBtn").onclick = () => { shown += PORCJA; render(); };

    document.getElementById("grid").innerHTML = total === 0
      ? `<div class="empty">${T.none}</div>`
      : widoczne.map(p => `
        <article class="card" onclick="openProduct(${p._i})" role="button" tabindex="0">
          <div class="thumb">
            ${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.brand)} ${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ""}
            ${illo(p)}
            <span class="badge">−${pct(p)}%</span>
            ${p.hot ? '<span class="tag">WYBÓR DROP</span>' : p.season === "lato" ? '<span class="tag">LATO</span>' : ""}
          </div>
          <div class="body">
            <div class="brand">${esc(p.brand)}</div>
            <div class="name">${esc(p.name)}</div>
            <div class="color">${esc(p.color || "")}</div>
            <div class="prices"><span class="pnew">${price(p.price, p.currency)}</span><span class="pold">${price(p.oldPrice, p.currency)}</span></div>
            <div class="store">${esc(p.store)}</div>
          </div>
          <button class="add ${sel.includes(p._i) ? "in" : ""}" onclick="toggleSel(${p._i}, event)"
            aria-label="Dodaj do torby">${sel.includes(p._i) ? "✓" : "+"}</button>
        </article>`).join("");
  }

  // ——— Przełącznik języka ———
  const sel_lang = document.getElementById("lang");
  Object.keys(I18N).forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = I18N[k].label;
    sel_lang.appendChild(o);
  });
  sel_lang.value = lang;
  sel_lang.onchange = e => {
    lang = e.target.value; T = I18N[lang];
    try { localStorage.setItem("drop_lang", lang); } catch (err) {}
    applyLang(); render(); updateBar();
  };

  // ——— Statystyki nad katalogiem ———
  function renderStats() {
    const n = PRODUCTS.length;
    const sklepy = new Set(PRODUCTS.map(p => p.store)).size;
    const sr = Math.round(PRODUCTS.reduce((a, p) => a + pct(p), 0) / n);
    const max = Math.max(...PRODUCTS.map(p => pct(p)));
    document.getElementById("stats").innerHTML = `
      <div class="stat"><b>${n}</b><span>${esc(T.statProducts)}</span></div>
      <div class="stat"><b>${sklepy}</b><span>${esc(T.statStores)}</span></div>
      <div class="stat"><b>−${sr}%</b><span>${esc(T.statAvg)}</span></div>
      <div class="stat"><b>−${max}%</b><span>${esc(T.statMax)}</span></div>`;
  }

  function renderRecent() {
    const w = document.getElementById("recentWrap"), r = document.getElementById("recentRow");
    if (!recent.length) { w.style.display = "none"; return; }
    w.style.display = "block";
    r.innerHTML = recent.map(i => { const p = PRODUCTS[i]; return `
      <article class="r-card" onclick="openProduct(${i})">
        <div class="thumb">
          ${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
          ${illo(p)}<span class="badge">−${pct(p)}%</span>
        </div>
        <div class="r-b">
          <div class="brand">${esc(p.brand)}</div>
          <div class="nm">${esc(p.name)}</div>
          <div class="pnew">${price(p.price, p.currency)}</div>
        </div>
      </article>`; }).join("");
  }

  function renderBrands() {
    document.getElementById("brandGrid").innerHTML = BRAND_SALES.map(b => `
      <a class="brand-c" href="${esc(b.url)}" target="_blank" rel="noopener sponsored"
         style="background:linear-gradient(145deg, ${b.hue}, #0C0A08)">
        <span class="b-off">${fill(T.upTo, { x: b.off })}</span>
        <h3>${esc(b.n)}</h3>
        <span class="b-store">${esc(b.store)} →</span>
      </a>`).join("");
  }

  function applyLang() {
    document.documentElement.lang = lang;
    const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    set("liveTxt", T.live);
    set("tEyebrow", T.eyebrow);
    document.getElementById("tH1").innerHTML = esc(T.h1a) + "<br><em>" + esc(T.h1b) + "</em>";
    set("tLead", T.lead);
    set("tSummer", T.summer); set("tOuter", T.outer);
    set("tOff30", T.off30); set("tOff40", T.off40);
    set("tFooter", T.footer);
    set("tBrandsTitle", T.brandsTitle); set("tBrandsLead", T.brandsLead);
    set("tRecent", T.recent);
    renderStats(); renderBrands(); renderRecent();
    set("tContact", T.contact);
    set("tPrivacy", T.privacy);
    document.getElementById("q").placeholder = T.search;
    // nowe sekcje
    set("tWhyTitle", T.whyTitle);
    set("tWhy1t", T.why1t); set("tWhy1d", T.why1d);
    set("tWhy2t", T.why2t); set("tWhy2d", T.why2d);
    set("tWhy3t", T.why3t); set("tWhy3d", T.why3d);
    set("tAlertTitle", T.alertTitle); set("tAlertLead", T.alertLead);
    set("tAlertBtn", T.alertBtn); set("alertOk", T.alertOk);
    document.getElementById("alertEmail").placeholder = T.alertPh;
    set("tAboutTitle", T.aboutTitle); set("tAboutBody", T.aboutBody);
    set("tFaqTitle", T.faqTitle);
    document.getElementById("faq").innerHTML = [1, 2, 3, 4].map(n =>
      `<details><summary>${esc(T["q" + n])}</summary><p>${esc(T["a" + n])}</p></details>`).join("");
    document.getElementById("barBtn").textContent = T.bagBtn;
    const so = document.getElementById("sortSel").options;
    so[0].textContent = T.sortDrop; so[1].textContent = T.sortAsc; so[2].textContent = T.sortDesc;
    document.querySelectorAll(".add").forEach(b => b.setAttribute("aria-label", T.add));
    // pasek przecen
    document.getElementById("ticker").innerHTML = [...hot, ...hot, ...hot].map(p =>
      `<span class="tick-item"><span class="tick-pct">−${pct(p)}%</span>${esc(p.brand)} ${esc(p.name)}<span class="tick-dot">●</span></span>`).join("");
  }

  // ——— Zapis na alerty (obsługa przez Netlify Forms) ———
  const af = document.getElementById("alertForm");
  af.addEventListener("submit", e => {
    e.preventDefault();
    const dane = new URLSearchParams(new FormData(af)).toString();
    fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: dane })
      .then(() => { af.style.display = "none"; document.getElementById("alertOk").style.display = "block"; })
      .catch(() => { af.style.display = "none"; document.getElementById("alertOk").style.display = "block"; });
  });

  // ——— Powrót na górę ———
  const tt = document.getElementById("toTop");
  tt.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
  let ttT;
  window.addEventListener("scroll", () => {
    clearTimeout(ttT);
    ttT = setTimeout(() => tt.classList.toggle("show", window.scrollY > 900), 80);
  }, { passive: true });

  // ——— Klawiatura: Esc zamyka panel ———
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeSheet();
  });

  // ——— Udostępnianie torby ———
  window.shareBag = async () => {
    const lista = sel.map(i => `${PRODUCTS[i].brand} ${PRODUCTS[i].name} — ${price(PRODUCTS[i].price, PRODUCTS[i].currency)}`).join("\n");
    const tekst = "DROP\n" + lista + "\n" + location.href;
    try {
      if (navigator.share) { await navigator.share({ title: "DROP", text: tekst }); return; }
      await navigator.clipboard.writeText(tekst);
      toast(T.shareCopied);
    } catch (e) {}
  };

  applyLang(); render(); updateBar();
})();
</script>
</body>
</html>
